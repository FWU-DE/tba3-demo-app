name: Lint, Tests, E2E & Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Die Weiterleitungen und der eigene Mock sollen nicht nur im Test,
      # sondern auch im ausgelieferten Stand funktionieren.
      - name: Ausgelieferten Stand prüfen
        run: |
          npm run preview &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
          set -e
          pruefe() {
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:4173$1")
            [ "$status" = "$2" ] || { echo "✗ $1 → $status (erwartet $2)"; exit 1; }
            echo "✓ $1 → $status"
          }
          pruefe / 200
          pruefe /demo/ 200
          pruefe /katalog/ 200
          pruefe /beispiele/ 200
          pruefe /dokumentation/ 200
          pruefe /dokumentation/konzepte 200
          pruefe /dokumentation/endpunkt-referenz 200
          pruefe /dokumentation/rezepte 200
          pruefe /dokumentation/rezepte.md 200
          pruefe /dokumentation/bausteine-der-rueckmeldungen 200
          pruefe /dokumentation/dokument.css 200
          pruefe /schnittstelle/ 200
          pruefe /schnittstelle/tba3-spec.yml 200
          pruefe /schnittstelle/material-spec.yml 200
          pruefe /gemeinsam/container.css 200
          pruefe /gemeinsam/tba3-leiste.js 200
          pruefe /gemeinsam/sprache.js 200
          pruefe /gemeinsam/konsortium.js 200
          pruefe /groups/3a-deutsch/competence-levels 200
          pruefe /materials 200
          pruefe /groups/gibtsnicht/items 404

  # Die E2E-Tests laufen gegen den ausgelieferten Stand (npm run build &&
  # npm run preview besorgt playwright.config.js selbst) — als eigener Job,
  # damit sie neben Lint und Unit-Tests laufen statt hinter ihnen.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Browser holen
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests
        run: npm run e2e

      # Bei einem Fehlschlag hängen Spur, Bild und Video am Lauf — ohne sie
      # ist ein Fehler, der nur in der CI auftritt, nicht zu greifen.
      - name: Bericht sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: |
            e2e/.bericht
            e2e/.ergebnisse
          retention-days: 7
