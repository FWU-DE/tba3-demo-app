name: Lint, Tests & Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Die Weiterleitungen und der eigene Mock sollen nicht nur im Test,
      # sondern auch im ausgelieferten Stand funktionieren.
      - name: Ausgelieferten Stand prüfen
        run: |
          npm run preview &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
          set -e
          pruefe() {
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:4173$1")
            [ "$status" = "$2" ] || { echo "✗ $1 → $status (erwartet $2)"; exit 1; }
            echo "✓ $1 → $status"
          }
          pruefe / 200
          pruefe /demo/ 200
          pruefe /katalog/ 200
          pruefe /beispiele/ 200
          pruefe /beispiele/rueckmeldungen.js 200
          pruefe /schnittstelle/ 200
          pruefe /schnittstelle/tba3-spec.yml 200
          pruefe /schnittstelle/material-spec.yml 200
          pruefe /gemeinsam/tba3-leiste.js 200
          pruefe /gemeinsam/sprache.js 200
          pruefe /groups/3a-deutsch/competence-levels 200
          pruefe /materials 200
          pruefe /groups/gibtsnicht/items 404
