<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TBA3 Component Catalog</title>
    <!-- Eine Spalte für alle Bereiche, ausgerichtet an der Leiste darüber -->
    <link rel="stylesheet" href="/gemeinsam/container.css" />
    <style>
      /* Der Katalog ist hell — PrimeVue Aura schaltet erst bei `.dark` um
         (siehe src/main.js). Gesagt werden muss das trotzdem: sonst fragen
         die Bausteine im Shadow DOM das Betriebssystem nach ihren Vorgaben
         und zeichnen dunkle Flächen in die weißen Karten. Warum das reicht,
         steht in packages/bausteine/kern/thema.js. */
      :root { color-scheme: light; }
    </style>
  </head>
  <body>
    <!-- Gemeinsame Leiste aller Bereiche; steht bewusst außerhalb von #app -->
    <tba3-leiste aktiv="katalog"></tba3-leiste>
    <div id="app"></div>
    <script>
      // Die Leiste liegt für alle Bereiche gemeinsam unter /gemeinsam/ und
      // gehört nicht ins Bündel dieser App. Deshalb zur Laufzeit angehängt:
      // ein <script src> im Markup würde Vite auflösen und mitbündeln wollen.
      (function () {
        var el = document.createElement('script');
        el.type = 'module';
        el.src = '/gemeinsam/tba3-leiste.js';
        document.head.appendChild(el);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
