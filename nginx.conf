server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # TBA3-API und LTI-Callback: eigener Mock im selben Container.
    # Das Image kommt damit ohne externes Backend aus; ein anderes lässt sich
    # über TBA3_API_BASE_URL für den MCP-Server bzw. hier im Proxy einhängen.
    location /tba3-api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Referenz-Backend von indibit — dieselbe Herkunft, damit "Try it out" in der
    # API-Referenz auch dagegen laufen kann (der Server sendet keine CORS-Köpfe).
    location /referenz-api/ {
        proxy_pass https://apps.indibit.eu/tba3-api/;
        proxy_ssl_server_name on;
        proxy_set_header Host apps.indibit.eu;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(groups|schools|states|lti-callback)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MCP server (Streamable HTTP / SSE) – kein Buffering, sonst kommt Content-Type nicht als text/event-stream an
    location /mcp {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # SPA-Fallback je Bereich – Portal, Demo und Katalog haben eigene index.html
    location /demo/ {
        try_files $uri $uri/ /demo/index.html;
    }

    location /katalog/ {
        try_files $uri $uri/ /katalog/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
